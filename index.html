<style>

  --over:#BA4D52;--over-text:#B23B42;--pos:#136B66;--neg:#B23B42;
  --warn-bg:#FFF3E0;--warn-border:#FFF3E0;--warn-title:#7A4108;--warn-body:#7A4108;--warn-chip:transparent;--warn-icon:#7A4108;
  --warn-btn-bg:#7A4108;--warn-btn-text:#FFFFFF;--pill-warn-bg:#FFF3E0;--pill-warn-text:#8A4B0F;

  --chip-invest-bg:#F9F2E6;

  --tab-bg:#FFFFFF;--tab-border:#E2EAF3;--tab-active:#136B66;--tab-idle:#5B6B7E;
  --skeleton:#E8EEF5;
}
:root[data-theme="dark"]{
  --bg:#0E1116;--surface:#171B22;--border:#222833;--divider:#222833;--track:#262C37;--dash:#2C333F;
  --text:#ECEFF4;--muted:#A3ADBD;--accent:#FFFFFF;
  --needs:#6CB6FF;--wants:#B49CFF;--saving:#7FE07A;--invest:#F2C14E;--invest-text:#F2C14E;--invest-dash:#4A3B18;
  --over:#FF8A8A;--over-text:#FF8A8A;--pos:#7FE07A;--neg:#FF8A8A;
  --warn-bg:#171B22;--warn-border:#4A3B18;--warn-title:#ECEFF4;--warn-body:#A3ADBD;--warn-chip:#2B2416;--warn-icon:#F2C14E;
  --warn-btn-bg:#F2C14E;--warn-btn-text:#1A1405;--pill-warn-bg:#2B2416;--pill-warn-text:#F5C76A;
  --chip-needs-bg:#16263A;--chip-needs:#6CB6FF;--chip-in-bg:#15301C;--chip-in:#7FE07A;--chip-warn-bg:#2B2416;--chip-warn:#F2C14E;
  --chip-debt-bg:#3A1C1F;--chip-debt:#FF8A8A;--chip-neutral-bg:#222833;--chip-neutral:#A3ADBD;--pill-debt-bg:#3A1C1F;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
main{display:flex;flex-direction:column;gap:16px;padding:16px 16px calc(96px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;min-height:100vh}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px}
.stack{display:flex;flex-direction:column}
.muted{color:var(--muted)}
.small{font-size:12px}
.note{margin:0;font-size:12px;line-height:1.5;color:var(--muted)}
h2{margin:0;font-size:17px;font-weight:700}
h3{margin:0;font-size:15px;font-weight:700}
.pill{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:13px;font-weight:600}
.linkbtn{border:0;background:transparent;padding:12px 0 12px 12px;font-size:14px;font-weight:600;color:var(--accent);cursor:pointer}
.refresh{border:0;background:transparent;padding:8px 0 8px 8px;font-size:12px;color:var(--muted);cursor:pointer}
/* hero */
.hero{background:var(--hero-bg);border:1px solid var(--hero-border);color:var(--hero-text);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px}
.hero .lbl{font-size:13px;color:var(--hero-label)}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.hero .grid2 .lbl{font-size:12px}
.hero .mid{font-size:17px;font-weight:700}
.hero .divider{height:1px;background:var(--hero-divider)}
.alloc{display:flex;gap:3px;height:6px}
.alloc span{display:block;height:6px;border-radius:3px}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
:root[data-theme="light"] .alloc,:root[data-theme="light"] .hero .dot{display:none}
:root[data-theme="dark"] .hero .lbl{font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
/* attention */
.warn{display:flex;gap:12px;align-items:flex-start;background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:16px;padding:14px 16px}
.warn .chip{width:36px;height:36px;flex:none;border-radius:10px;background:var(--warn-chip);color:var(--warn-icon);display:flex;align-items:center;justify-content:center}
:root[data-theme="light"] .warn .chip{width:22px;height:22px;margin-top:1px}
.warn .t{font-size:14px;font-weight:700;color:var(--warn-title)}
.warn .b{font-size:13px;line-height:1.5;color:var(--warn-body)}
.warn button{align-self:flex-start;height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--warn-btn-bg);color:var(--warn-btn-text);font-size:14px;font-weight:700;cursor:pointer}
/* bars */
.bucket{display:flex;flex-direction:column;gap:6px}
.bname{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.sw.outline{background:transparent!important;border:2px solid var(--invest)}
.amt{font-size:13px;color:var(--muted)}
.amt strong{color:var(--text);font-weight:700}
.track{height:8px;border-radius:99px;background:var(--track);overflow:hidden;display:flex;gap:2px}
.track.lg{height:10px}
.track span{display:block;height:100%}
.track .solo{border-radius:99px}
.over{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--over-text)}
.sep{padding-top:14px;border-top:1px dashed var(--dash)}
/* list */
.list{list-style:none;margin:0;padding:4px 16px;background:var(--surface);border:1px solid var(--border);border-radius:16px}
.list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--divider)}
.list li:last-child{border-bottom:0}
.ic{width:40px;height:40px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center}
.ic.round{border-radius:999px}
.ic.needs{background:var(--chip-needs-bg);color:var(--chip-needs)}
.ic.in{background:var(--chip-in-bg);color:var(--chip-in)}
.ic.warnc{background:var(--chip-warn-bg);color:var(--chip-warn)}
.ic.debt{background:var(--chip-debt-bg);color:var(--chip-debt)}
.ic.neutral{background:var(--chip-neutral-bg);color:var(--chip-neutral)}
.ic.invest{background:var(--chip-invest-bg);color:var(--invest-text)}
.li-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li-title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-sub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.li-amt{font-size:14px;font-weight:700;white-space:nowrap}
.tag{padding:2px 8px;border-radius:999px;font-weight:600}
.tag.warnt{background:var(--pill-warn-bg);color:var(--pill-warn-text)}
.tag.debtt{background:var(--pill-debt-bg);color:var(--chip-debt)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
/* budget */
.monthnav{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:4px}
.monthnav button{width:44px;height:44px;border:0;border-radius:10px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
.monthnav button:disabled{opacity:.3;cursor:default}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .v{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ratio{display:flex;gap:3px;height:12px}
.ratio span{display:block;height:12px;border-radius:2px}
.ratio span:first-child{border-radius:6px 2px 2px 6px}
.ratio span:last-child{border-radius:2px 6px 6px 2px}
.dashed{border-style:dashed;border-color:var(--invest-dash)}
.chart{height:150px;display:grid;gap:8px;align-items:end;border-bottom:1px solid var(--dash)}
.chart .col{display:flex;justify-content:center;align-items:flex-end;gap:3px;height:100%}
.chart .col span{width:14px;border-radius:4px 4px 0 0;min-height:2px}
.chart-labels{display:grid;gap:8px;margin-top:-6px;font-size:12px;color:var(--muted);text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* riwayat */
.dayhead{margin:0;padding:4px 4px 0;font-size:13px;font-weight:700;color:var(--muted)}
.idchip{border:0;margin:0;padding:2px 6px;border-radius:6px;background:var(--chip-neutral-bg);color:var(--chip-neutral);font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer}
/* subkategori */
.subbtn{display:flex;flex-direction:column;gap:6px;width:100%;margin:0;padding:10px 0;border:0;background:transparent;text-align:left;cursor:pointer;font-size:13px}
.subbtn .chev{display:inline-flex;transition:transform .15s ease;color:var(--muted)}
.subbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){.subbtn .chev{transition:none}}
.sublist{list-style:none;margin:0 0 8px;padding:0 0 0 12px;border-left:2px solid var(--divider)}
.sublist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--divider)}
.sublist li:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 32px);padding:10px 14px;border-radius:12px;background:var(--text);color:var(--bg);font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:6}
.toast.show{opacity:1}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--tab-bg);border-top:1px solid var(--tab-border);padding:6px 8px calc(12px + env(safe-area-inset-bottom));z-index:5}
nav.tabs button{min-height:52px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:var(--tab-idle);cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--tab-active);font-weight:700}
/* states */
.sk{background:var(--skeleton);border-radius:16px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.center{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:28px 20px}
.btn{height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:14px;font-weight:700;cursor:pointer}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;padding:1px 5px;border-radius:6px;background:var(--track)}
</style>
</head>

/* ---------- komponen ---------- */
function bar(used,max,color,big){
  var cls='track'+(big?' lg':'');
  if(max<=0)return '<div class="'+cls+'"></div>';
  if(used<=max)return '<div class="'+cls+'"><span class="solo" style="width:'+Math.max(0,Math.min(100,used/max*100))+'%;background:'+color+'"></span></div>';
  return '<div class="'+cls+'"><span style="width:'+(max/used*100)+'%;background:'+color+'"></span><span style="flex:1;background:var(--over)"></span></div>';
}
function head(label,swatch,used,max,prefix){
  return '<div class="row" style="align-items:baseline"><span class="bname"><span class="sw" style="background:'+swatch+'"></span>'+label+'</span>'+
    '<span class="amt num">'+(prefix||'')+'<strong>'+rp(used)+'</strong> / '+rp(max)+'</span></div>';
}
function txIcon(r){
  if(r.kind==='InvestmentBuy'||r.kind==='InvestmentSell')return '<span class="ic invest">'+(r.kind==='InvestmentBuy'?IC.trend:IC.inn)+'</span>';
  if(r.kind==='Income'||r.kind==='Refund'||r.kind==='LoanBorrow'||r.kind==='LoanCollect')return '<span class="ic in">'+IC.inn+'</span>';
  if(r.kind==='Expense'&&r.category==='Uncategorized')return '<span class="ic warnc">'+IC.out+'</span>';
  if(r.kind==='Expense'||r.kind==='FundExpense'||r.kind==='LoanLend'||r.kind==='LoanRepay')return '<span class="ic needs">'+IC.out+'</span>';
  return '<span class="ic neutral">'+IC.swap+'</span>';
}
function txAmount(r){
  var s=cashSign(r);
  if(r.kind==='BalanceAdjustment')return '<span class="li-amt num">'+rpSigned(r.amount)+'</span>';
  if(s>0)return '<span class="li-amt num pos">+'+rp(r.amount)+'</span>';
  if(s<0)return '<span class="li-amt num">−'+rp(r.amount)+'</span>';
  return '<span class="li-amt num muted">'+rp(r.amount)+'</span>';
}
/* Label kelompok. Deskripsi baris sistem sudah menjelaskan dirinya ("Alokasi hp", "Setor investasi"), jadi labelnya pendek. */
var KIND={Income:'Pemasukan',Expense:'',FundExpense:'Belanja dari fund',Refund:'Refund',Transfer:'Transfer lama',FundAllocation:'Fund',FundRelease:'Fund',
  Sweep:'Tutup buku',InvestmentBuy:'Investasi',InvestmentSell:'Investasi',OpeningBalance:'',
  LoanBorrow:'Utang',LoanLend:'Piutang',LoanRepay:'Utang',LoanCollect:'Piutang',BalanceAdjustment:'Bukan income/expense'};
/* o.noDate: tanggal sudah ada di judul grup (Riwayat). o.id: tampilkan ID yang bisa diketuk untuk disalin. */
function txItem(r,today,o){
  o=o||{};var when=o.noDate?'':dayLabel(r.at,today),sub,parts;
  var idc=o.id?'<button type="button" class="idchip" data-copy="'+esc(r.id)+'" aria-label="Salin ID '+esc(r.id)+'">#'+esc(r.id)+'</button>':'';
  if(r.kind==='Expense'&&r.category==='Uncategorized')sub='<span class="tag warnt">Belum berkategori</span>'+esc([r.sub,when].filter(Boolean).join(' · '));
  else {
    if(r.kind==='Expense')parts=[r.category,r.sub,when];
    else if(r.kind==='FundExpense')parts=['Dari fund '+title(r.fund),r.sub,when];
    else if(r.kind==='Refund')parts=['Refund',r.sub,when];
    else parts=[r.kind in KIND?KIND[r.kind]:r.kind,when];
    sub=esc(parts.filter(Boolean).join(' · '));
  }
  return '<li>'+txIcon(r)+'<div class="li-main"><span class="li-title">'+esc(r.desc)+'</span><span class="li-sub">'+sub+idc+'</span></div>'+txAmount(r)+'</li>';

/* Status Investment satu baris untuk Ringkasan. Payload lama (tanpa invest) tetap didukung. */
function investLine(b){
  var iv=b.invest;

  return iv.plan>0?'<strong>'+rp(iv.covered)+'</strong> disetor ✓':'Belum ada rencana';

    return '<div><button type="button" class="subbtn" data-sub="'+esc(key)+'" aria-expanded="'+open+'">'+row+'</button>'+
      (open?'<ul class="sublist">'+(items.length?items.map(function(r){return subItem(r,d.today);}).join(''):'<li class="note">Tidak ada transaksi.</li>')+'</ul>':'')+'</div>';
  }).join('')+'<p class="note" style="margin-top:8px">'+(tx?'Ketuk subkategori untuk melihat transaksinya. ':'')+'Termasuk belanja dari fund; refund mengurangi jumlahnya.</p></section>';
}
function renderBudget(d){
  var b=d.budget,m=d.month,h='',cur=d.current,start=d.start||cur;
  h+=monthNav(d);
  h+='<div class="grid3"><div class="stat"><span class="small muted">Pemasukan</span><span class="v num" title="'+rp(b.income)+'">'+rpShort(b.income)+'</span></div>'+
    '<div class="stat"><span class="small muted">Pengeluaran</span><span class="v num" title="'+rp(b.spent)+'">'+rpShort(b.spent)+'</span></div>'+
    '<div class="stat"><span class="small muted">Arus kas</span><span class="v num '+(b.cashFlow>=0?'pos':'neg')+'" title="'+rpSigned(b.cashFlow)+'">'+rpShort(b.cashFlow,true)+'</span></div></div>';
  var r=b.ratio||[0,0,0,0],cols=['var(--needs)','var(--wants)','var(--saving)','var(--invest)'],names=['Needs','Wants','Saving','Investment'];
  h+='<section class="card stack" style="gap:14px" aria-labelledby="jr"><div class="row" style="align-items:baseline"><h3 id="jr">Rasio aktif</h3><span class="num" style="font-size:15px;font-weight:700">'+r.join(' / ')+'</span></div>'+
    '<div class="ratio" aria-hidden="true">'+r.map(function(p,i){return p>0?'<span style="width:'+p+'%;background:'+cols[i]+'"></span>':'';}).join('')+'</div>'+
    '<div class="grid2" style="gap:10px 12px">'+names.map(function(n,i){return '<div class="stack" style="gap:2px"><span class="small muted"><span class="dot" style="background:'+cols[i]+'"></span>'+n+' '+r[i]+'%</span><span class="num" style="font-size:14px;font-weight:700">'+rp(b.planned[i])+'</span></div>';}).join('')+'</div>'+
    '<p class="note">Rasio baru hanya berlaku untuk pemasukan baru. Alokasi bulan-bulan sebelumnya tidak berubah.</p></section>';
  h+='<section class="stack" style="gap:8px" aria-labelledby="jrv"><h2 id="jrv" style="padding:4px 0">Rencana vs terpakai</h2><div class="card stack" style="gap:18px">'+budgetCard(d,false)+'</div>'+
    investCard(b)+'</section>';
  if(b.unknown>0)h+='<section class="warn"><span class="chip">'+IC.warn+'</span><div class="stack" style="gap:4px"><span class="t">'+rp(b.unknown)+' belum berkategori</span><span class="b">Belum dihitung ke Needs atau Wants, dan mengurangi jumlah yang disapu saat tutup buku.</span></div></section>';
  var closing;
  if(m<cur)closing=b.swept>0?'Disapu ke Emergency: <strong class="num">'+rp(b.swept)+'</strong>':'Tidak ada sisa yang disapu.';
  else closing='Perkiraan sapu ke Emergency: <strong class="num">'+rp(b.sweep)+'</strong>. Tutup buku otomatis tanggal 2 bulan depan.';
  h+='<section class="card stack" style="gap:6px" aria-label="Tutup buku"><h3>Tutup buku</h3><span style="font-size:13px">'+closing+'</span>'+
    (b.wants>b.wantsBudget?'<span class="small muted">Kelebihan Wants '+rp(b.wants-b.wantsBudget)+' memotong jatah Wants bulan berikutnya.</span>':'')+'</section>';
  h+=subSection(d);
  var tr=(d.trend||[]).filter(function(t){return t.month>=start;});
  if(tr.length){
    var top=Math.max.apply(null,tr.map(function(t){return Math.max(t.income,t.spent);}).concat([1])),n=tr.length;
    var aria='Pemasukan dan pengeluaran per bulan: '+tr.map(function(t){return monthShort(t.month)+' '+rp(t.income)+' dan '+rp(t.spent);}).join('; ')+'.';
    h+='<figure class="card stack" style="margin:0;gap:14px" aria-label="'+esc(aria)+'"><figcaption class="row" style="align-items:baseline"><h3>Tren '+n+' bulan</h3><span class="small muted">dari bulan saldo awal</span></figcaption>'+
      '<div class="chart" aria-hidden="true" style="grid-template-columns:repeat('+n+',minmax(0,1fr))">'+tr.map(function(t){
        var running=t.month===cur;
        return '<div class="col"><span style="height:'+(t.income/top*140)+'px;background:var(--chart-in)"></span><span style="height:'+(t.spent/top*140)+'px;background:var(--chart-out)'+(running?';opacity:.55':'')+'"></span></div>';
      }).join('')+'</div>'+
      '<div class="chart-labels" aria-hidden="true" style="grid-template-columns:repeat('+n+',minmax(0,1fr))">'+tr.map(function(t){return '<span'+(t.month===m?' style="font-weight:700;color:var(--text)"':'')+'>'+monthShort(t.month)+'</span>';}).join('')+'</div>'+
      '<div class="legend"><span><span class="sw" style="background:var(--chart-in)"></span>Pemasukan</span><span><span class="sw" style="background:var(--chart-out)"></span>Pengeluaran</span>'+
      (tr.some(function(t){return t.month===cur;})?'<span>'+monthShort(cur)+' masih berjalan</span>':'')+'</div></figure>';
  }
  h+='<p class="note">Utang-piutang serta setoran dan penarikan investasi tidak dihitung sebagai pemasukan atau pengeluaran.</p>';
  return h;
}
function renderFunds(d){
  var s=d.saldo,b=d.budget,h='';
  h+='<section class="card stack" style="border-radius:20px;padding:18px;gap:12px" aria-label="Ringkasan funds"><div class="stack" style="gap:4px"><span class="muted" style="font-size:13px">Total di funds</span>'+
    '<span class="num" style="font-size:28px;font-weight:800;letter-spacing:-.4px">'+rp(s.reserved)+'</span></div>'+
    '<div class="stack" style="gap:6px"><div class="row amt num"><span>Kontribusi '+MONTHS[Number(d.current.slice(5,7))-1]+'</span><span><strong>'+rp(b.netContrib)+'</strong> / '+rp(b.savingLimit)+'</span></div>'+
    bar(Math.max(0,b.netContrib),b.savingLimit,'var(--saving)')+'</div>'+
    '<p class="note">Uang di funds tetap bagian dari saldo likuid. Funds hanya menandai uang itu untuk tujuan tertentu.</p></section>';
  var funds=(d.funds||[]).filter(function(f){return f.balance>0||f.target!==null;});
  h+='<section class="stack" style="gap:8px" aria-labelledby="jf"><div class="row" style="align-items:baseline;padding:4px 0"><h2 id="jf">Funds</h2><span class="muted" style="font-size:13px">'+funds.length+' fund</span></div>';
  if(!funds.length)h+='<div class="card note">Belum ada dana yang dialokasikan. Kirim <code>alokasi emergency 50k</code> di chat, atau tunggu tutup buku tanggal 2.</div>';
  funds.forEach(function(f,i){
    var em=f.name==='emergency',icon='<span class="ic '+(em?'in':(f.target!==null?'needs':'neutral'))+'">'+(em?IC.shield:IC.target)+'</span>';
    if(f.target!==null&&f.target>0){
      var p=pct(f.balance,f.target),color=em?'var(--saving)':'var(--needs)';
      h+='<div class="card row" style="align-items:flex-start;gap:12px;padding:14px 16px">'+icon+'<div class="stack" style="flex:1;min-width:0;gap:6px">'+
        '<div class="row" style="align-items:baseline"><span style="font-size:15px;font-weight:700">'+esc(title(f.name))+'</span><span class="amt num"><strong>'+rp(f.balance)+'</strong> / '+rp(f.target)+'</span></div>'+
        bar(Math.min(f.balance,f.target),f.target,color)+'<span class="small muted">'+p+'%'+(f.balance<f.target?' · kurang '+rp(f.target-f.balance)+' dari target':' · target tercapai')+'</span></div></div>';
    } else {
      h+='<div class="card row" style="gap:12px;padding:14px 16px">'+icon+'<div class="row" style="flex:1;min-width:0;align-items:baseline"><span style="font-size:15px;font-weight:700">'+esc(title(f.name))+'</span>'+
        '<span class="amt num"><strong>'+rp(f.balance)+'</strong> · tanpa target</span></div></div>';
    }
  });
  h+='</section>';
  h+='<section class="stack" style="gap:8px" aria-labelledby="ju"><h2 id="ju" style="padding:4px 0">Utang &amp; piutang</h2>'+
    '<div class="grid2" style="gap:8px"><div class="stat"><span class="small muted">Harus ditagih</span><span class="v num pos" style="font-size:17px">'+rp(s.receivable)+'</span></div>'+
    '<div class="stat"><span class="small muted">Harus dibayar</span><span class="v num neg" style="font-size:17px">'+rp(s.payable)+'</span></div></div>';
  var loans=(d.loans||[]).slice().sort(function(a,c){return (a.due||'9999').localeCompare(c.due||'9999');});
  if(loans.length){
    h+='<ul class="list">'+loans.map(function(l){
      var piut=l.type==='piutang',sub;
      if(l.overdue)sub=(piut?'Piutang':'Utang')+'<span class="tag debtt">Terlambat sejak '+esc(dayLabel(l.due,d.today))+'</span>';
      else sub=esc((piut?'Piutang':'Utang')+(l.due?' · tempo '+Number(l.due.slice(8,10))+' '+monthShort(l.due)+' '+l.due.slice(0,4):' · tanpa tempo'));
      return '<li><span class="ic round '+(l.overdue?'debt':(piut?'in':'debt'))+'">'+(l.overdue?IC.clock:IC.person)+'</span><div class="li-main"><span class="li-title">'+esc(l.person)+'</span><span class="li-sub">'+sub+'</span></div>'+
        '<span class="li-amt num '+(piut?'pos':'neg')+'">'+rp(l.remaining)+'</span></li>';
    }).join('')+'</ul>';
  } else h+='<div class="card note">Tidak ada utang atau piutang aktif.</div>';
  h+='<p class="note">Kas berubah saat pinjam atau bayar, tetapi budget pemasukan dan pengeluaran tidak.</p></section>';
  return h;
}
function renderSkeleton(){
  return '<div class="sk" style="height:32px;width:140px;border-radius:999px"></div><div class="sk" style="height:190px;border-radius:20px"></div><div class="sk" style="height:260px"></div><div class="sk" style="height:220px"></div>';
}
function renderError(e){
  var auth=e&&e.code==='auth';
  return '<section class="card center" role="alert"><h2>'+(auth?'Sesi tidak dikenali':'Data gagal dimuat')+'</h2><p class="note">'+esc(e&&e.message||'')+
    (auth?' Tutup lalu buka lagi lewat tombol Dashboard di chat bot.':'')+'</p><button type="button" class="btn" data-act="refresh">Coba lagi</button></section>';
}
function renderNotTelegram(reason){
  return '<section class="card center"><h2>Buka dari Telegram</h2><p class="note">'+reason+'</p><p class="note">Pratinjau dengan data contoh: tambahkan <code>?demo=1</code> di alamat halaman ini.</p></section>';
}
function render(){
  document.querySelectorAll('nav.tabs button').forEach(function(btn){
    if(btn.getAttribute('data-tab')===state.tab)btn.setAttribute('aria-current','page');else btn.removeAttribute('aria-current');
  });
  if(state.blocked){screen.innerHTML=renderNotTelegram(state.blocked);return;}
  if(state.error){var e=state.error;state.error=null;screen.innerHTML=renderError(e);return;}
  if(!state.home||(state.loading&&state.tab==='home')){screen.innerHTML=renderSkeleton();return;}
  if(state.tab==='budget'||state.tab==='history'){
    var d=state.byMonth[state.budgetMonth];
    screen.innerHTML=d&&!state.loading?(state.tab==='budget'?renderBudget(d):renderHistory(d)):renderSkeleton();
  } else if(state.tab==='funds')screen.innerHTML=renderFunds(state.home);
  else screen.innerHTML=renderHome(state.home);
}

/* ---------- interaksi ---------- */
document.querySelector('nav.tabs').addEventListener('click',function(ev){
  var btn=ev.target.closest('button[data-tab]');if(!btn)return;
  var t=btn.getAttribute('data-tab');if(t===state.tab)return;
  state.tab=t;haptic();render();window.scrollTo(0,0);
});
screen.addEventListener('click',function(ev){
  var go=ev.target.closest('[data-tab-go]');
  if(go){state.tab=go.getAttribute('data-tab-go');haptic();render();window.scrollTo(0,0);return;}
  var sub=ev.target.closest('[data-sub]');
  if(sub){var k=sub.getAttribute('data-sub');state.openSubs[k]=!state.openSubs[k];haptic();render();
    var again=screen.querySelector('[data-sub="'+(window.CSS&&CSS.escape?CSS.escape(k):k)+'"]');if(again)again.focus({preventScroll:true});return;}
  var cp=ev.target.closest('[data-copy]');
  if(cp){
    var id=cp.getAttribute('data-copy'),done=function(){toast('ID '+id+' disalin');},fail=function(){toast('ID: '+id);};
    try{navigator.clipboard.writeText(id).then(done,fail);}catch(e){fail();}
    return;
  }
  var act=ev.target.closest('[data-act]');if(!act)return;
  var a=act.getAttribute('data-act');
  if(a==='refresh'){state.byMonth={};state.budgetMonth=null;loadHome();}
  else if(a==='close'){if(tg)tg.close();}
  else if(a==='prev'||a==='next'){haptic();loadBudgetMonth(addMonth(state.budgetMonth,a==='prev'?-1:1));}
});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&state.home&&!state.demo&&Date.now()-state.loadedAt>60000){state.byMonth={};state.budgetMonth=null;loadHome();}
});

/* ---------- mulai ---------- */
if(state.demo){loadHome();}
else{
  state.api=apiUrl();
  if(!tg||!tg.initData)state.blocked='Dashboard ini hanya bisa dibuka lewat tombol Dashboard di chat bot Binbin.';
  else if(!state.api)state.blocked='Alamat data belum terpasang. Jalankan activateMiniApp() di Apps Script, lalu buka lagi dari tombol Dashboard.';
  if(state.blocked)render();else loadHome();
}
})();
</script>
</body>
</html>
